<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060607" />
      <stop offset="55%" stop-color="#0b0a09" />
      <stop offset="100%" stop-color="#141008" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="88%" r="62%">
      <stop offset="0%" stop-color="#c9a45c" stop-opacity="0.30" />
      <stop offset="45%" stop-color="#8a6a2a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="78%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06" />
      </feComponentTransfer>
    </filter>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a45c" stop-opacity="0" />
      <stop offset="30%" stop-color="#c9a45c" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#c9a45c" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#c9a45c" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#base)" />

  <g transform="rotate(-14 800 450)" fill="none" stroke="url(#fade)" stroke-width="1.4">
    <path d="M-100 300 C 300 120, 500 480, 900 300 S 1500 120, 1900 300" />
    <path d="M-100 420 C 300 240, 500 600, 900 420 S 1500 240, 1900 420" />
    <path d="M-100 540 C 300 360, 500 720, 900 540 S 1500 360, 1900 540" />
    <circle cx="340" cy="450" r="150" />
    <circle cx="340" cy="450" r="105" />
    <circle cx="1260" cy="450" r="150" />
    <circle cx="1260" cy="450" r="105" />
  </g>

  <g transform="rotate(-14 800 450)" fill="none" stroke="#c9a45c" stroke-opacity="0.10" stroke-width="1">
    <path d="M-100 360 C 300 180, 500 540, 900 360 S 1500 180, 1900 360" />
    <path d="M-100 480 C 300 300, 500 660, 900 480 S 1500 300, 1900 480" />
  </g>

  <rect width="1600" height="900" fill="url(#glow)" />
  <rect width="1600" height="900" fill="url(#vignette)" />
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.5" />
</svg>
