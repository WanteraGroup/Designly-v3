# A kliens a bejelentkezett felhasznalo access tokenjet kuld, nem az anon keyt.
# A verify_jwt nelkul minden funkcio egy nyitott vegpont: a Groq token, a HF
# ZeroGPU kvota es az Unsplash keret a projekt tulajdonosaet terheli, barki
# hivhassa. A JWT bekapcsolasa utan a Supabase a fuggetlen ellenorzi a tokent,
# es a 401-et a funkcio kodja elott adja vissza.
#
# FIGYELEM: a kliensnek ezzel egyutt session tokent kell kuldenie. Amig a
# src/lib/*.ts az anon keyt kuldi, ezek a vegpontok 401-gyel valaszolnak.
# A kliensoldali atallas ugyanezen a branchen van (src/lib/supabase-client.ts).

[functions.designly-v3-agent]
verify_jwt = true
entrypoint = "./functions/designly-v3-agent/index.ts"

