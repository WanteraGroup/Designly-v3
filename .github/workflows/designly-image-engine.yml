name: Designly Image Engine

on:
  push:
    branches: [main]
    paths:
      - "services/designly-image-engine/**"
      - ".github/workflows/designly-image-engine.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/designly-image-engine
          push: true
          tags: |
            ghcr.io/wanteragroup/designly-image-engine:latest
            ghcr.io/wanteragroup/designly-image-engine:${{ github.sha }}
